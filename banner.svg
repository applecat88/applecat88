  <text x="72" y="248" fill="#d7d3cb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">Design  ·  Full-Stack Development  ·  AI Engineer  ·  Expert</text>
  <text x="72" y="302" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18">Turning ideas into working products, from the screen to the system behind it.</text>
